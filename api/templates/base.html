<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Django Chat{% endblock %}</title>
  <style>
    :root { --accent: #2563eb; --border: #e2e8f0; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #0f172a; }
    .container { max-width: 720px; margin: 0 auto; padding: 1.5rem; }
    header.topbar { display: flex; justify-content: space-between; align-items: center; }
    a { color: var(--accent); }
    .messages { background: #fff; border: 1px solid var(--border); border-radius: 0.5rem;
      min-height: 50vh; max-height: 60vh; overflow-y: auto; padding: 1rem; margin: 1rem 0; }
    .message { margin-bottom: 0.75rem; padding: 0.5rem 0.75rem; background: var(--bg);
      border-radius: 0.375rem; }
    .message header { font-size: 0.8rem; color: #64748b; margin-bottom: 0.25rem; }
    .message p { margin: 0; white-space: pre-wrap; }
    .message.me { border-left: 3px solid var(--accent); }
    textarea { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; background: var(--accent); color: #fff;
      border: 0; border-radius: 0.375rem; cursor: pointer; }
    .errorlist { color: #dc2626; list-style: none; padding: 0; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h1>{% block heading %}Django Chat{% endblock %}</h1>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <span>{{ user.username }}</span>
          <button type="submit">Log out</button>
        </form>
      {% endif %}
    </header>
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
