name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Lint with flake8 (wemake-python-styleguide)
        run: uv run flake8 .

      - name: Check formatting with black
        run: uv run black --check api tasks tests main.py manage.py

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: api.config.settings
      USE_REDIS_FOR_CACHE: "false"
      TASKIQ_IN_MEMORY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q